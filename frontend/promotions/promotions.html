<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <title>Promotions | Retail System</title>
    <link rel="stylesheet" href="../common/css/frost.css?v=9">
    <link rel="stylesheet" href="promotions.css?v=9">
    <script defer src="https://cdn.jsdelivr.net/npm/axios@1.11.0/dist/axios.min.js"></script>
    <script defer src="../common/js/api.js?v=9"></script>
    <script defer src="../common/js/validation.js?v=9"></script>
    <script defer src="../common/js/layout.js?v=9"></script>
    <script defer src="promotions.js?v=9"></script>
</head>

<body data-page="promotions">
    <div id="app-header"></div>
    <main class="page-shell">
        <section class="promotion-workspace">
            <article class="frost-panel editor-panel">
                <form id="promotion-form" class="panel-padding">
                    <h2 class="section-kicker">Promotion configuration</h2>
                    <input id="promotion-id" type="hidden"><label>Promotion code<input id="code" required maxlength="30"
                            pattern="[A-Za-z0-9][A-Za-z0-9_-]*" title="Use letters, numbers, hyphens or underscores."
                            placeholder="e.g. FESTIVE20"></label>
                    <label>Promotion name<input id="promotion-name" required maxlength="100"
                            pattern="[A-Za-z][A-Za-z0-9 .&amp;'()\-]*" title="Start with a letter."></label>
                    <div class="form-grid"><label>Discount %<input id="discount" type="number" min="0.01" max="100"
                                step="0.01" required></label><label>Minimum purchase<input id="minimum" type="number"
                                min="0" step="0.01" required value="0"></label></div>
                    <div class="form-grid"><label>Valid from<input id="start-date" type="date"
                                required></label><label>Valid until<input id="end-date" type="date"
                                required></label></div>
                    <label>Status<select id="promotion-status" required>
                        <option value="SCHEDULED">Scheduled</option><option value="ACTIVE">Active</option>
                        <option value="EXPIRED">Expired</option><option value="INACTIVE">Inactive</option>
                    </select></label>
                    <div class="form-actions"><button type="button" id="promotion-clear"
                            class="btn btn-secondary">Clear</button><button class="btn btn-primary">Deploy
                            promotion</button></div>
                </form>
            </article>
            <article class="frost-panel rules-panel">
                <div class="catalogue-toolbar">
                    <div class="search-wrap"><span>&#128269;</span><input id="promotion-search"
                            placeholder="Search promotion registry"></div>
                </div>
                <div class="table-wrap">
                    <table>
                        <thead>
                            <tr>
                                <th>Promotion ID</th>
                                <th>Rule</th>
                                <th>Discount</th>
                                <th>Validity timeline</th>
                                <th>Status</th>
                                <th>Action</th>
                            </tr>
                        </thead>
                        <tbody id="promotion-body"></tbody>
                    </table>
                </div>
            </article>
        </section>
    </main>
    <div id="global-loader" class="global-loader">
        <div class="loader-ring"></div>
    </div>
</body>

</html>
