server.port=${SERVER_PORT:8081}
spring.application.name=retail-system

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/retailflow_pos?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=${DDL_AUTO:validate}
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false
spring.jpa.show-sql=${SHOW_SQL:true}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Kolkata

logging.level.org.springframework.security=${SECURITY_LOG_LEVEL:INFO}
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=${MAX_FILE_SIZE:5MB}
spring.servlet.multipart.max-request-size=${MAX_REQUEST_SIZE:5MB}
server.servlet.session.timeout=${SESSION_TIMEOUT:30m}
server.error.include-message=never

# Demo data is useful for training and can be disabled in production.
app.seed-demo-data=${SEED_DEMO_DATA:true}
app.demo-password=${DEMO_PASSWORD:password}
