<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <title>Reports | Retail System</title>
    <link rel="stylesheet" href="../common/css/frost.css?v=9">
    <link rel="stylesheet" href="reports.css?v=9">
    <script defer src="https://cdn.jsdelivr.net/npm/axios@1.11.0/dist/axios.min.js"></script>
    <script defer src="../common/js/api.js?v=9"></script>
    <script defer src="../common/js/validation.js?v=9"></script>
    <script defer src="../common/js/layout.js?v=9"></script>
    <script defer src="reports.js?v=9"></script>
</head>

<body data-page="reports">
    <div id="app-header"></div>
    <main class="page-shell">
        <section class="frost-panel report-filter"><label>From<input id="start-date" type="date"></label><label>To<input
                    id="end-date" type="date"></label>
            <div class="report-actions"><button id="run-report" class="btn btn-primary">Generate report</button><button id="new-settlement" class="btn btn-secondary">Create
                    settlement</button></div>
        </section>
        <section id="report-summary" class="grid grid-2 report-summary"></section>
        <section class="frost-panel report-table">
            <div class="panel-title">
                <div>
                    <h2>Sales transactions</h2>
                    <p id="transaction-count">Choose a date range</p>
                </div>
            </div>
            <div class="table-wrap">
                <table>
                    <thead>
                        <tr>
                            <th>Receipt</th>
                            <th>Date</th>
                            <th>Cashier</th>
                            <th>Payment</th>
                            <th>Status</th>
                            <th>Total</th>
                        </tr>
                    </thead>
                    <tbody id="report-body"></tbody>
                </table>
            </div>
        </section>
        <section class="frost-panel settlements">
            <div class="panel-title">
                <div>
                    <h2>Settlement history</h2>
                    <p>Closed cashier business days</p>
                </div>
            </div>
            <div class="table-wrap">
                <table>
                    <thead>
                        <tr>
                            <th>Date</th>
                            <th>Cashier</th>
                            <th>Transactions</th>
                            <th>Cash</th>
                            <th>Card</th>
                            <th>UPI</th>
                            <th>Total</th>
                        </tr>
                    </thead>
                    <tbody id="settlement-body"></tbody>
                </table>
            </div>
        </section>
    </main>
    <dialog id="settlement-modal" class="modal">
        <form id="settlement-form">
            <div class="modal-head">
                <h2>Create settlement</h2><button type="button" class="icon-btn" id="settlement-close">&times;</button>
            </div>
            <div class="modal-body form-grid"><label>Business date<input id="settlement-date" type="date"
                        required></label><label>Cashier<select id="settlement-cashier" required></select></label><label
                    class="full">Notes<textarea id="settlement-notes"></textarea></label></div>
            <div class="modal-actions"><button type="button" id="settlement-cancel"
                    class="btn btn-secondary">Cancel</button><button class="btn btn-primary">Close settlement</button>
            </div>
        </form>
    </dialog>
    <div id="global-loader" class="global-loader">
        <div class="loader-ring"></div>
    </div>
</body>

</html>
